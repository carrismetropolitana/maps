# Massive thank you to @ricardojorgerm and @tiagogaspar8
# for the help in creating this nginx configuration file.


# # #
# USER

user nginx;


# # #
# WORKER PROCESSES

worker_processes auto;



# # #
# DEFAULTS

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;


# # #
# EVENTS

events {
    use epoll;
    worker_connections 2048;
}


# # #
# HTTP

http {

	# #
	# MIME TYPES

	include /etc/nginx/mime.types;
	default_type application/octet-stream;


	# #
	# LOGS

	log_format main '$time_iso8601 | $status | IP $remote_addr | Request: "$request" | Referer: "$http_referer" | User Agent: "$http_user_agent"';

	access_log /var/log/nginx/access.log main;


	# #
	# FILE DESCRIPTOR SETTINGS

	aio threads;
	directio 512M;
	output_buffers 2 1M;
	sendfile on;
	tcp_nopush on;

	keepalive_timeout 65;


	# # #
	# CLOUDFLARE TRUSTED IPS

	include cloudflare.conf;


	# # #
	# RATE LIMITS

	limit_req_zone global zone=global:10m rate=500r/s;
	limit_req zone=global burst=200 delay=2;

	limit_req_zone $remote_addr zone=ip:10m rate=50r/s;
	limit_req zone=ip burst=50 delay=2;

	limit_req_status 429;


	# # #
	# COMPRESSION

	gzip on;
	gzip_types application/json;


	# # #
	# CACHE

	proxy_cache_path /var/cache/nginx/tileserver levels=1:2 keys_zone=tileserver_cache:512m inactive=360m;


	# # #
	# UPSTREAM

	upstream tileserver_upstream {
		zone upstreams 64K;
		server tileserver:8080 max_fails=2 fail_timeout=2s;
		keepalive 10;
	}


	# # #
	# DEFAULT HTTP SERVER
	# Redirect to HTTPS

	server {

		listen 80;
		listen [::]:80;
		server_name maps.carrismetropolitana.pt;
		server_tokens off;

		location /.well-known/acme-challenge/ {
			root /var/www/certbot;
		}

		location / {
			return 301 https://$host$request_uri;
		}

	}


	# # #
	# HTTPS SERVER

	server {

		listen 443 ssl;
		listen [::]:443 ssl;
		server_name maps.carrismetropolitana.pt;
		server_tokens off;
		http2 on;

		# Lets Encrypt Certificates
		ssl_certificate /etc/letsencrypt/live/maps.carrismetropolitana.pt/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/maps.carrismetropolitana.pt/privkey.pem;
		include /etc/letsencrypt/options-ssl-nginx.conf;
		ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
		ssl_early_data on;

		# Do not skip cache by default
		set $skip_cache 0;
		set $skip_reason "";

		# Cache configuration
		etag on;
		proxy_cache tileserver_cache;
		proxy_cache_key "$scheme$request_method$host$request_uri";
		proxy_cache_valid 200 24h;
		proxy_cache_valid any 30s;
		proxy_cache_lock on;
		proxy_cache_lock_age 30s;
		proxy_cache_lock_timeout 90s;
		proxy_cache_use_stale error timeout updating;
		proxy_cache_revalidate on;
		proxy_cache_bypass $skip_cache;

		# Proxy configuration
		proxy_http_version 1.1;
		proxy_connect_timeout 10s;
		proxy_send_timeout 20s;
		proxy_read_timeout 20s;

		# This include directive sets up required headers
		# for tileserver to propely generate tiles.
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		proxy_next_upstream error timeout http_500;


		# # #
		# LOCATION #

		location / {
			if ($request_method = 'OPTIONS') {
				add_header 'Access-Control-Allow-Origin' "*" always;
				add_header 'Access-Control-Allow-Credentials' 'true' always;
				add_header 'Access-Control-Allow-Headers' "Origin, X-Requested-With, Content-Type, Accept" always;
				add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
				add_header 'Access-Control-Max-Age' 1728000;
				add_header 'Content-Type' 'text/plain; charset=utf-8';
				add_header 'Content-Length' 0;
				return 204;
			}
			# Remove default headers
			proxy_hide_header Access-Control-Allow-Origin;
			# Add headers
			add_header CMET-Cache-Skip $skip_reason;
			add_header CMET-Cache-Status $upstream_cache_status;
			add_header Access-Control-Allow-Origin "*" always;
			add_header Cache-Control "public, max-age=86400" always;
			add_header Strict-Transport-Security "max-age=31536000" always;
			# Proxy connect
			proxy_pass http://tileserver_upstream;
		}

		# Enable for basic statistics
		# location = /basic_status {
		#     stub_status;
		# }

	}

}